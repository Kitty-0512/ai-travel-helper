name: Keep Render Alive

on:
  schedule:
    # 每 5 分钟 ping 一次，防止 Render 免费实例休眠
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check
        run: |
          curl -sf https://ai-travel-helper.onrender.com/api/health/live
          echo "Ping done"
