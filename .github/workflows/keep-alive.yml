name: Keep Render Alive

on:
  schedule:
    # 每 5 分钟 ping 一次，防止 Render 免费实例休眠
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check
        run: |
          set -e
          URL="https://ai-travel-helper.onrender.com/api/health/live"
          for i in 1 2 3; do
            if curl -sf --max-time 30 "$URL"; then
              echo ""
              echo "Ping ok (attempt $i)"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "All ping attempts failed"
          exit 1
