services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel_helper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/001_user_memory.sql:/docker-entrypoint-initdb.d/001_user_memory.sql:ro
      - ./backend/sql/002_agent_trace.sql:/docker-entrypoint-initdb.d/002_agent_trace.sql:ro
      - ./backend/sql/003_travel_sessions.sql:/docker-entrypoint-initdb.d/003_travel_sessions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_helper"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://travel:travel@postgres:5432/travel_helper
      MCP_SERVER_SCRIPT: ../travel-mcp-server/server.py
      ENV: development
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_API_SECRET_KEY: ${API_SECRET_KEY:-change-me-to-a-random-string}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
